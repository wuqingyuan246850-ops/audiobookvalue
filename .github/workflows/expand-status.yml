name: Expand Status

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run pipeline self-check
        run: node scripts/check-pipeline.js

      - name: Count pending candidates
        id: pending
        run: |
          PENDING=$(node -e "const p=JSON.parse(require('fs').readFileSync('pending-books.json','utf-8')); console.log(p.candidates.length)")
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "Pending candidates: $PENDING"

      - name: Flag candidates awaiting finalization
        if: steps.pending.outputs.pending != '0'
        run: |
          echo "::error::There are pending audiobook candidates that need finalizing."
          exit 1
