name: Daily Audiobook Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh audiobook data
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: yuanyuan07-20
        run: node scripts/auto-update.js

      - name: Generate pages
        run: node scripts/generate.js

      - name: Audit and auto-remove invalid ASINs
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: yuanyuan07-20
        run: node scripts/audit-books.js --auto-remove

      - name: Commit and push if changed
        run: |
          git config user.name "audiobookvalue-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
          else
            git commit -m "chore: daily audiobook data refresh"
            git push
          fi
