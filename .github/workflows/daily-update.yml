name: Daily Audiobook Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audiobookvalue-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh audiobook data
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: yuanyuan07-20
        run: node scripts/auto-update.js

      - name: Audit and auto-remove invalid ASINs
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: yuanyuan07-20
        run: node scripts/audit-books.js --auto-remove

      - name: Generate blog post if changed
        run: node scripts/blog-post.js

      - name: Generate pages
        run: node scripts/generate.js

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "audiobookvalue-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3; do
            git fetch origin
            git reset --soft origin/main
            git restore --source=origin/main -- audiobooks sitemap.xml stats.json index.html _redirects category || true
            node scripts/generate.js
            git add -A
            if git diff --cached --quiet; then
              echo "No data changes; skipping commit."
              exit 0
            fi
            git commit -m "chore: daily audiobook data refresh"
            if git push origin main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (concurrent update); retrying..."
            sleep 5
          done
          echo "Push failed after retries."
          exit 1
