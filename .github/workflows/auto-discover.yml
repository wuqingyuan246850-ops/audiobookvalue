name: Auto Discover Audiobooks

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audiobookvalue-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Daily random slot gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            HOUR=$(date -u +%H)
            DAY_SEED=$(date -u +%Y%m%d)
            TARGET=$(( 0x$(printf "%s" "$DAY_SEED" | md5sum | cut -c1-6) % 24 ))
            echo "random slot today: $TARGET, current hour: $HOUR"
            if [ "$HOUR" -eq "$TARGET" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "manual trigger; running now"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Discover audiobook candidates
        if: steps.gate.outputs.should_run == 'true'
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: yuanyuan07-20
        run: node scripts/auto-discover.js

      - name: Validate candidate ASINs
        if: steps.gate.outputs.should_run == 'true'
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: yuanyuan07-20
        run: node scripts/validate-candidates.js

      - name: Finalize candidates with template content
        if: steps.gate.outputs.should_run == 'true'
        run: node scripts/template-finalize.js

      - name: Generate blog post if changed
        if: steps.gate.outputs.should_run == 'true'
        run: node scripts/blog-post.js

      - name: Generate pages
        if: steps.gate.outputs.should_run == 'true'
        run: node scripts/generate.js

      - name: Commit and push if changed
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -e
          git config user.name "audiobookvalue-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3; do
            git fetch origin
            git reset --soft origin/main
            git restore --source=origin/main -- audiobooks sitemap.xml stats.json index.html _redirects category || true
            node scripts/generate.js
            git add -A
            if git diff --cached --quiet; then
              echo "No changes; skipping commit."
              exit 0
            fi
            git commit -m "chore: auto-discover audiobook candidates"
            if git push origin main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (concurrent update); retrying..."
            sleep 5
          done
          echo "Push failed after retries."
          exit 1
