name: Auto Discover Audiobooks

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover audiobook candidates
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: yuanyuan07-20
        run: node scripts/auto-discover.js

      - name: Commit and push if changed
        run: |
          git config user.name "audiobookvalue-bot"
          git config user.email "actions@github.com"
          git pull --rebase origin main
          git add -A
          if git diff --cached --quiet; then
            echo "No new candidates; skipping commit."
          else
            git commit -m "chore: auto-discover audiobook candidates"
            git push
          fi
